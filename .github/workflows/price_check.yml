name: Game Price Check

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
    inputs:
      check_only:
        description: "Validate configuration and database without sending alerts"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: drophunter-game-sweep
  cancel-in-progress: false

jobs:
  check-prices:
    if: github.event_name == 'workflow_dispatch' || vars.GAME_CHECK_ENABLED != 'false'
    runs-on: ${{ vars.GAME_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      LOCAL_DB_URL: ${{ secrets.LOCAL_DB_URL }}
      DB_SCHEMA: ${{ vars.DB_SCHEMA || 'public' }}
      ITAD_API_KEY: ${{ secrets.ITAD_API_KEY }}
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      OWNER_ID: ${{ secrets.OWNER_ID }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      AI_PROVIDER: ${{ vars.AI_PROVIDER || secrets.AI_PROVIDER || 'groq' }}
      OMNIROUTE_BASE_URL: ${{ vars.OMNIROUTE_BASE_URL }}
      OMNIROUTE_MODEL: ${{ vars.OMNIROUTE_MODEL }}
      OMNIROUTE_API_KEY: ${{ secrets.OMNIROUTE_API_KEY }}
      OMNIROUTE_TIMEOUT_SECONDS: ${{ vars.OMNIROUTE_TIMEOUT_SECONDS || '60' }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      LANGFUSE_TRACING_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt
      - name: Verify configuration and database
        run: .venv/bin/python -m cron.preflight
      - name: Run price check
        if: ${{ !inputs.check_only }}
        run: .venv/bin/python -m cron.price_check --games
