name: Game Price Check

on:
  schedule:
    - cron: "0 */12 * * *"   # every 12 hours
  workflow_dispatch:

jobs:
  check-prices:
    runs-on: self-hosted      # needs local Postgres access

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up venv and install dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt

      - name: Run price check
        env:
          LOCAL_DB_URL: ${{ secrets.LOCAL_DB_URL }}
          ITAD_API_KEY: ${{ secrets.ITAD_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AI_PROVIDER: ${{ secrets.AI_PROVIDER }}
        run: .venv/bin/python -m cron.price_check --games
